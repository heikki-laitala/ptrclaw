name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  pull-requests: write

jobs:
  build-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: g++ clang meson ninja-build libssl-dev libsqlite3-dev lld
          version: 1.0

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install meson sqlite3

      - name: Cache build
        uses: actions/cache@v4
        with:
          path: builddir
          key: meson-${{ matrix.os }}-${{ hashFiles('meson.build', 'meson-native-*.ini', 'src/**/*.cpp', 'src/**/*.hpp') }}
          restore-keys: meson-${{ matrix.os }}-

      - name: Build
        run: make build

      - name: Test
        run: make test

      - name: Binary size check
        run: |
          MAX_BYTES=2097152  # 2.0 MB
          BIN=builddir/ptrclaw
          if [ ! -f "$BIN" ]; then
            echo "::error::Binary not found"
            exit 1
          fi
          SIZE=$(wc -c < "$BIN" | tr -d ' ')
          SIZE_HR=$(awk "BEGIN {printf \"%.1f MB\", $SIZE / 1048576}")
          echo "Binary: ${SIZE_HR} (${SIZE} bytes)"
          if [ "$SIZE" -gt "$MAX_BYTES" ]; then
            echo "::error::Binary ${SIZE_HR} exceeds limit of 2.0 MB"
            exit 1
          fi

      - name: Job summary
        if: always()
        run: |
          echo "## ptrClaw CI — ${{ matrix.os }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY

          if [ -f builddir/meson-logs/testlog.txt ]; then
            PASS=$(grep -c '^OK' builddir/meson-logs/testlog.txt || true)
            FAIL=$(grep -c '^FAIL' builddir/meson-logs/testlog.txt || true)
            echo "| Tests passed | ${PASS:-0} |" >> $GITHUB_STEP_SUMMARY
            echo "| Tests failed | ${FAIL:-0} |" >> $GITHUB_STEP_SUMMARY
          fi

          BIN=builddir/ptrclaw
          if [ -f "$BIN" ]; then
            SIZE=$(wc -c < "$BIN" | tr -d ' ')
            SIZE_HR=$(awk "BEGIN {printf \"%.1f MB\", $SIZE / 1048576}")
            echo "| Binary | ${SIZE_HR} (${SIZE} bytes) |" >> $GITHUB_STEP_SUMMARY
            echo "| Size limit | 2.0 MB |" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload binary
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ptrclaw-${{ matrix.os == 'ubuntu-latest' && 'linux-x86_64' || 'macos-aarch64' }}
          path: builddir/ptrclaw

  sdk-build:
    name: SDK Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: g++ clang meson ninja-build libssl-dev libmbedtls-dev libsqlite3-dev lld
          version: 1.0

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install meson sqlite3 mbedtls

      - name: Cache build
        uses: actions/cache@v4
        with:
          path: builddir-emb
          key: meson-sdk-${{ matrix.os }}-${{ hashFiles('meson.build', 'meson-native-*.ini', 'src/**/*.cpp', 'src/**/*.hpp') }}
          restore-keys: meson-sdk-${{ matrix.os }}-

      - name: Build SDK
        run: make build-sdk

      - name: Build & test with embed
        run: |
          SDK_FLAGS="-Dwith_embed=true -Dwith_telegram=false -Dwith_whatsapp=false -Dwith_ollama=false -Dwith_tools=false -Dcatch2:tests=false"
          if [ ! -d builddir-emb ]; then
            if [ "$(uname)" = "Darwin" ]; then
              meson setup builddir-emb --native-file meson-native-macos.ini $SDK_FLAGS
            else
              meson setup builddir-emb --native-file meson-native-linux.ini $SDK_FLAGS
            fi
          fi
          meson compile -C builddir-emb
          meson test -C builddir-emb --print-errorlogs

      - name: SDK binary size check
        run: |
          MAX_BYTES=1572864  # 1.5 MB
          LIB=""
          for f in builddir-sdk/libptrclaw_shared.dylib builddir-sdk/libptrclaw_shared.so; do
            [ -f "$f" ] && LIB="$f" && break
          done
          if [ -z "$LIB" ]; then
            echo "::error::SDK shared library not found"
            exit 1
          fi
          SIZE=$(wc -c < "$LIB" | tr -d ' ')
          SIZE_HR=$(awk "BEGIN {printf \"%.1f KB\", $SIZE / 1024}")
          echo "SDK library: ${SIZE_HR} (${SIZE} bytes)"
          if [ "$SIZE" -gt "$MAX_BYTES" ]; then
            echo "::error::SDK library ${SIZE_HR} exceeds limit of 1.5 MB"
            exit 1
          fi

      - name: Job summary
        if: always()
        run: |
          echo "## ptrClaw SDK — ${{ matrix.os }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          LIB=""
          for f in builddir-sdk/libptrclaw_shared.dylib builddir-sdk/libptrclaw_shared.so; do
            [ -f "$f" ] && LIB="$f" && break
          done
          if [ -n "$LIB" ]; then
            SIZE=$(wc -c < "$LIB" | tr -d ' ')
            SIZE_HR=$(awk "BEGIN {printf \"%.1f KB\", $SIZE / 1024}")
            echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| Shared library (stripped) | ${SIZE_HR} (${SIZE} bytes) |" >> $GITHUB_STEP_SUMMARY
            echo "| Size limit | 1.5 MB |" >> $GITHUB_STEP_SUMMARY
          fi

  lint:
    name: Lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: g++ clang meson ninja-build libssl-dev libsqlite3-dev clang-tidy lld
          version: 1.0

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install meson llvm sqlite3
          echo "$(brew --prefix llvm)/bin" >> $GITHUB_PATH

      - name: Cache build
        uses: actions/cache@v4
        with:
          path: builddir
          key: meson-${{ matrix.os }}-${{ hashFiles('meson.build', 'meson-native-*.ini', 'src/**/*.cpp', 'src/**/*.hpp') }}
          restore-keys: meson-${{ matrix.os }}-

      - name: Build
        run: make build

      - name: Lint (changed files on PR)
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -eo pipefail
          git fetch origin main --depth=1
          CHANGED=$(git diff --name-only --diff-filter=d origin/main...HEAD -- '*.cpp' '*.hpp' | grep -E '^(src|tests)/' || true)
          if [ -n "$CHANGED" ]; then
            if [ "$(uname)" = "Darwin" ]; then
              CLANG_TIDY_EXTRA="-extra-arg=-stdlib=libc++ -extra-arg=-isysroot$(xcrun --show-sdk-path)"
            else
              CLANG_TIDY_EXTRA=""
            fi
            clang-tidy -p builddir -warnings-as-errors='*' $CLANG_TIDY_EXTRA $CHANGED 2>&1 | grep -v 'warnings generated'
          else
            echo "No changed src/tests files to lint"
          fi

      - name: Lint (all files on main)
        if: github.event_name == 'push'
        run: make lint

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: g++ clang meson ninja-build libssl-dev libsqlite3-dev lld llvm gcovr
          version: 1.0

      - name: Coverage
        run: |
          meson setup builddir-cov --native-file meson-native-linux.ini -Db_coverage=true -Db_lto=false -Dcatch2:tests=false
          meson test -C builddir-cov
          gcovr -x --root . builddir-cov --filter src/ --exclude-directories 'subprojects' --gcov-executable 'llvm-cov gcov' > coverage.xml

      - name: Coverage report
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: coverage.xml
          format: markdown
          output: both

      - name: Job summary
        run: |
          if [ -f code-coverage-results.md ]; then
            cat code-coverage-results.md >> $GITHUB_STEP_SUMMARY
          fi

  # ── Configurations CI never built ───────────────────────────────────────────
  #
  # `make build` uses the defaults, and with_http, with_whatsapp and with_file_read all
  # default to false. So src/channels/http.cpp, src/channels/whatsapp.cpp,
  # src/channels/webhook_server.cpp and three test files were linted but never compiled,
  # by any job, on any libc — and their tests had never run anywhere.
  #
  # That gap shipped a compile error: `struct timeval` without <sys/time.h> in
  # webhook_server.cpp (#110). It is also why the musl leg below exists rather than
  # ubuntu alone — glibc's <sys/socket.h> provides that header transitively, so an Ubuntu
  # job would have compiled the broken file happily. The bug was found by a downstream
  # Alpine image build, which is not a reasonable place to learn about it.
  optional-features:
    name: Optional features (${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: channels
            flags: -Dwith_http=true -Dwith_whatsapp=true
          - label: read-only tools
            flags: -Dwith_tools=false -Dwith_file_read=true

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: g++ clang meson ninja-build libssl-dev libsqlite3-dev lld
          version: 1.0

      - name: Build and test
        run: |
          meson setup builddir-opt --native-file meson-native-linux.ini \
            -Dcatch2:tests=false ${{ matrix.flags }}
          meson compile -C builddir-opt
          meson test -C builddir-opt --print-errorlogs

  musl-build:
    name: musl build (channels)
    runs-on: ubuntu-latest
    container: alpine:3.22

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apk add --no-cache build-base clang lld meson ninja pkgconf \
            mbedtls-dev mbedtls-static musl-dev linux-headers sqlite-dev bash

      # Only what musl can tell us that glibc cannot: whether these files compile and
      # their tests pass against a different libc. Not a second full matrix.
      - name: Build and test
        run: |
          meson setup builddir-musl --native-file meson-native-linux.ini \
            -Dcatch2:tests=false -Dwith_mbedtls=true \
            -Dwith_http=true -Dwith_whatsapp=true
          meson compile -C builddir-musl
          meson test -C builddir-musl --print-errorlogs
